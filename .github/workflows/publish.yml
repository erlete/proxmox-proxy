name: publish

# release-please publishes a GitHub Release when its PR merges; that is the
# signal to build and push the image. The tag (vX.Y.Z) drives the image tags.
on:
  release:
    types: [published]

permissions:
  contents: write # attach deploy artifacts as release assets
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # metadata-action lowercases the image name, so DLT-Code resolves to
          # ghcr.io/dlt-code/proxmox-proxy.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Attach the deploy files LAST so an upload failure never blocks the image
      # push (a release created while immutable releases was on rejects uploads;
      # newer, mutable releases accept them and a host `gh release download`s
      # them, see README).
      - name: Attach deploy artifacts to the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Upload the env template under a dot-less name: GitHub rewrites a
        # leading-dot asset to "default.env.example", which the README's
        # `gh release download -p env.example` pattern would then miss.
        run: |
          cp .env.example env.example
          gh release upload "${{ github.event.release.tag_name }}" compose.yml env.example --clobber
