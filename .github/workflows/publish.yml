name: publish

# release-please publishes a GitHub Release when its PR merges; that is the
# signal to build and push the image. The tag (vX.Y.Z) drives the image tags.
on:
  release:
    types: [published]

permissions:
  contents: write # upload deploy artifacts as release assets
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A host deploys with just these two files (see README): make them release
      # assets so `gh release download` fetches them without cloning the repo.
      - name: Attach deploy artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" compose.yml .env.example --clobber
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # metadata-action lowercases the image name, so DLT-Code resolves to
          # ghcr.io/dlt-code/proxmox-proxy.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
