name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # gh pr merge shells out to git, so the job needs a checkout to run in.
      - uses: actions/checkout@v4
      # Conventional commits drive the version bump and the changelog. The PAT
      # (already configured as RELEASE_PLEASE_PAT) lets the release PR trigger
      # the other workflows on merge, which the default GITHUB_TOKEN cannot.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
      # Auto-merge the release PR so a tagged release is cut without a manual
      # click. Merge immediately: --admin bypasses branch protection on this
      # sole-authority repo. (--auto is avoided on purpose: with no required
      # checks it just enables auto-merge and leaves the PR sitting open.)
      # The fallbacks cover a repo without admin bypass or protection.
      - name: Auto-merge the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          number=$(echo "$PR_JSON" | jq -r '.number')
          echo "Merging release PR #$number"
          gh pr merge "$number" -R "$REPO" --squash --admin \
            || gh pr merge "$number" -R "$REPO" --squash \
            || gh pr merge "$number" -R "$REPO" --squash --auto
