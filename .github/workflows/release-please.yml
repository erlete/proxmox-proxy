name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # gh pr merge shells out to git, so the job needs a checkout to run in.
      - uses: actions/checkout@v4
      # Conventional commits drive the version bump and the changelog. The PAT
      # (already configured as RELEASE_PLEASE_PAT) lets the release PR trigger
      # the other workflows on merge, which the default GITHUB_TOKEN cannot.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
      # Auto-merge the release PR so a tagged release is cut without a manual
      # click. Runs every time (the release-please outputs only flag a NEWLY
      # created PR, not one it merely updated, which would skip the merge on all
      # but the first run); instead look up the open release PR by its label.
      # Merge immediately with --admin (bypasses branch protection on this
      # sole-authority repo); --auto is avoided on purpose because with no
      # required checks it just enables auto-merge and leaves the PR open.
      - name: Merge the open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
          REPO: ${{ github.repository }}
        run: |
          number=$(gh pr list -R "$REPO" --state open \
            --label "autorelease: pending" --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then echo "no open release PR to merge"; exit 0; fi
          echo "Merging release PR #$number"
          gh pr merge "$number" -R "$REPO" --squash --admin \
            || gh pr merge "$number" -R "$REPO" --squash
