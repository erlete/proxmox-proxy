name: ci

on:
  push:
    branches: [stable]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix panel
      - name: Typecheck
        run: npm run typecheck
      - name: Format check
        run: npx prettier --check "src/**/*.ts" "scripts/**/*.ts" "test/**/*.ts"
      - name: Test
        run: npm test
      - name: Build panel
        run: npm run build --prefix panel
