services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    # Caddy is the only exposed container. DEPLOY_HOST/DEPLOY_PORT decide on
    # which network the proxy is reachable (default: loopback only).
    ports:
      - '${DEPLOY_HOST:-127.0.0.1}:${DEPLOY_PORT:-8000}:8000'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - proxy
    networks:
      - internal

  proxy:
    # Published by the release workflow. `docker compose pull` fetches this on a
    # deploy host; `docker compose up --build` still builds from source locally,
    # tagging the same name. Pin a release with PROXY_IMAGE_TAG in .env.
    image: ghcr.io/dlt-code/proxmox-proxy:${PROXY_IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - proxy_data:/data
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
  proxy_data:
