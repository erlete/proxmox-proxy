# Single-service deploy: the app is the entrypoint and multiplexes the data
# plane and the management panel on one port, so there is no reverse-proxy
# sidecar. Fetch this file plus .env.example from a release, fill in .env, and
# `docker compose up -d`. A real edge (TLS/domain/VPN) is expected in front.
name: proxmox-proxy

services:
  proxy:
    image: ghcr.io/erlete/proxmox-proxy:${PROXY_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    # Bind to loopback by default; DEPLOY_HOST/DEPLOY_PORT choose where the
    # single port is published on the host.
    ports:
      - '${DEPLOY_HOST:-127.0.0.1}:${DEPLOY_PORT:-8000}:8000'
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Fixed name (not project-prefixed) so re-deploys never orphan the SQLite
  # state that holds the API keys, settings and operation log.
  data:
    name: proxmox-proxy-data
